<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seminário — Show</title>
<style>
:root{--bg:#07090d;--fg:#eef2f6;--muted:#7d8794;--line:#202733;--hot:#8ee6ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,Segoe UI,Arial,sans-serif}
body{cursor:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:28px;top:24px;pointer-events:none;letter-spacing:.16em;text-transform:uppercase;font-size:10px;color:#697482}
#title{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .7s}
#title h1{font-size:clamp(28px,5vw,70px);font-weight:300;letter-spacing:.08em;margin:0}
#title p{margin:16px 0 0;color:#7d8794;font-size:12px;letter-spacing:.24em}
#lens{position:fixed;width:110px;height:110px;border:1px solid rgba(142,230,255,.5);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);opacity:0;box-shadow:0 0 35px rgba(142,230,255,.08),inset 0 0 25px rgba(142,230,255,.04)}
#help{position:fixed;right:28px;bottom:22px;color:#5f6975;font-size:10px;letter-spacing:.1em;pointer-events:none}
#scene{position:fixed;right:28px;top:24px;color:#5f6975;font-size:10px;letter-spacing:.14em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">SEMINÁRIO · EXPERIÊNCIA</div>
<div id="scene">01 / 05</div>
<div id="lens"></div>
<div id="title"><h1>EVOLUÇÃO</h1><p>do código à experiência</p></div>
<div id="help">← → cenas · ESC início · espaço próxima</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const lens=document.getElementById('lens'),sceneLabel=document.getElementById('scene'),title=document.getElementById('title');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2),scene=0,mx=-9999,my=-9999,hasPointer=false,last=performance.now();
const particles=Array.from({length:900},(_,i)=>({a:Math.random()*Math.PI*2,r:80+Math.random()*Math.min(W,H)*.42,s:1+Math.random()*2,seed:Math.random()*1000}));
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;hasPointer=true;lens.style.left=mx+'px';lens.style.top=my+'px';lens.style.opacity=1});
addEventListener('pointerleave',()=>{hasPointer=false;lens.style.opacity=0});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();scene=Math.min(4,scene+1)}if(e.key==='ArrowLeft')scene=Math.max(0,scene-1);if(e.key==='Escape')scene=0;updateLabel()});
function updateLabel(){sceneLabel.textContent=String(scene+1).padStart(2,'0')+' / 05';title.style.opacity=scene===4?1:0}
function clear(){ctx.fillStyle='#07090d';ctx.fillRect(0,0,W,H)}
function text(t,x,y,size,color='#eef2f6',align='left'){ctx.font=size+'px Inter,Segoe UI,Arial,sans-serif';ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y)}
function line(x1,y1,x2,y2,color='#202733',w=1){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function card(x,y,w,h,type,hot){ctx.fillStyle='#0b0f15';ctx.fillRect(x,y,w,h);ctx.strokeStyle=hot?'rgba(142,230,255,.65)':'#202733';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
const pad=22; text(type,x+pad,y+27,10,hot?'#8ee6ff':'#697482');
if(type==='CASOS'){for(let i=0;i<7;i++){let bh=h*.1+i*h*.08;ctx.fillStyle=hot?'rgba(142,230,255,'+(0.25+i*.08)+')':'#202733';ctx.fillRect(x+pad+i*(w-2*pad)/7,y+h-25-bh,(w-2*pad)/7-7,bh)}}
if(type==='SAZONALIDADE'){ctx.strokeStyle=hot?'#8ee6ff':'#313945';ctx.lineWidth=hot?2:1;ctx.beginPath();for(let i=0;i<12;i++){let xx=x+pad+i*(w-2*pad)/11;let yy=y+h/2+Math.sin(i*.72)*h*.18;if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.stroke()}
if(type==='CLUSTERS'){for(let i=0;i<18;i++){let gx=x+pad+((i%6)/5)*(w-2*pad),gy=y+h/2+Math.sin(i*1.7)*h*.22;ctx.fillStyle=hot?(i%3===0?'#8ee6ff':i%3===1?'#d4a8ff':'#9ff0b5'):'#39424e';ctx.beginPath();ctx.arc(gx,gy,hot?4:2,0,Math.PI*2);ctx.fill()}}
if(type==='OUTLIERS'){for(let i=0;i<24;i++){let xx=x+pad+((i*37)%100)/100*(w-2*pad),yy=y+45+((i*61)%100)/100*(h-65);ctx.fillStyle=hot&&i%7===0?'#ffcf70':'#39424e';ctx.beginPath();ctx.arc(xx,yy,hot&&i%7===0?5:2,0,Math.PI*2);ctx.fill()}}
if(type==='FAIXA'){for(let i=0;i<5;i++){let yy=y+50+i*20;line(x+pad,yy,x+w-pad,yy,hot?'#263b47':'#202733');if(hot){ctx.fillStyle='#8ee6ff';ctx.fillRect(x+pad,yy-2,(w-2*pad)*(0.25+i*.13),4)}}}
}
function scene0(t){clear();text('ANTES',W/2,100,11,'#697482','center');text('um projeto',W/2,128,16,'#eef2f6','center');
const names=['CASOS','SAZONALIDADE','CLUSTERS','OUTLIERS','FAIXA'];const gap=18,cw=Math.min(260,(W-100-gap*2)/3),ch=190;let positions=[];
for(let i=0;i<5;i++){let col=i%3,row=Math.floor(i/3),x=W/2-(col===2?cw*1.5+gap/2:col===1?cw/2+gap/2:0),y=H/2-100+row*(ch+gap);positions.push([x,y,cw,ch]);}
positions.forEach((p,i)=>{let [x,y,w,h]=p;let hot=hasPointer&&mx>x-25&&mx<x+w+25&&my>y-25&&my<y+h+25;card(x,y,w,h,names[i],hot);if(hot){ctx.strokeStyle='rgba(142,230,255,.12)';ctx.strokeRect(x-12,y-12,w+24,h+24);text('acordou',x+w-18,y+h-16,9,'#8ee6ff','right')}})
text('coloque o mouse sobre um quadro',W/2,H-55,11,'#697482','center')}
function scene1(t){clear();text('UM QUADRO',W/2,72,11,'#697482','center');text('parece estático',W/2,100,22,'#eef2f6','center');
const cx=W/2,cy=H/2+35,rad=Math.min(W,H)*.34;for(let i=0;i<particles.length;i++){let p=particles[i],ang=p.a,rr=p.r,px=cx+Math.cos(ang)*rr,py=cy+Math.sin(ang)*rr*.68;let d=Math.hypot(px-mx,py-my),inf=hasPointer?Math.max(0,1-d/150):0;let s=p.s*(1+inf*3),alpha=.16+inf*.75;ctx.fillStyle='rgba(142,230,255,'+alpha+')';ctx.beginPath();ctx.arc(px,py,s,0,Math.PI*2);ctx.fill();if(inf>.65){line(px,py,px+(px-cx)*.025,py+(py-cy)*.025,'rgba(142,230,255,.18)',1)}}text('aproxime a lente',W/2,H-55,11,'#697482','center')}
function scene2(t){clear();text('A IMAGEM',W/2,72,11,'#697482','center');text('começa a se organizar',W/2,100,22,'#eef2f6','center');const cx=W/2,cy=H/2+35;for(let i=0;i<360;i++){let g=i%3,ang=(i/360)*Math.PI*2;let base=80+g*100;let tx=cx+Math.cos(ang*3+g)*base,ty=cy+Math.sin(ang*2+g)*base*.65;let px=tx,py=ty;if(hasPointer){let d=Math.hypot(tx-mx,ty-my),q=Math.max(0,1-d/220);px=tx+(cx+g*70-tx)*q*.45;py=ty+(cy+(g-1)*80-ty)*q*.45}ctx.fillStyle=g===0?'#8ee6ff':g===1?'#d4a8ff':'#9ff0b5';ctx.globalAlpha=.3+(hasPointer?.5:0);ctx.beginPath();ctx.arc(px,py,2.4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}text('K-MEANS',W/2,H-55,11,hasPointer?'#8ee6ff':'#697482','center')}
function scene3(t){clear();text('O QUE NÃO SE ENCAIXA',W/2,72,11,'#697482','center');text('também pode ser encontrado',W/2,100,22,'#eef2f6','center');for(let i=0;i<260;i++){let x=W*.2+(i%20)*W*.031,y=H*.32+Math.floor(i/20)*H*.035;let out=i%29===0||i%47===0;let d=Math.hypot(x-mx,y-my),q=hasPointer?Math.max(0,1-d/190):0;ctx.fillStyle=out?(q>.15?'#ffcf70':'#39424e'):'#39424e';ctx.globalAlpha=out?.9:.55;let r=out?3.5+q*4:2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();if(out&&q>.25){ctx.strokeStyle='rgba(255,207,112,.35)';ctx.beginPath();ctx.arc(x,y,10+q*12,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1}text('OUTLIERS',W/2,H-55,11,hasPointer?'#ffcf70':'#697482','center')}
function scene4(t){clear();ctx.fillStyle='#eef2f6';ctx.fillRect(W/2-1,0,2,H);text('CÓDIGO',W*.25,H/2-20,13,'#697482','center');text('EXPERIÊNCIA',W*.75,H/2-20,13,'#eef2f6','center');text('o mesmo projeto',W/2,H/2+30,12,'#697482','center');}
function draw(t){let dt=(t-last)/1000;last=t;if(scene===0)scene0(t);else if(scene===1)scene1(t);else if(scene===2)scene2(t);else if(scene===3)scene3(t);else scene4(t);requestAnimationFrame(draw)}
updateLabel();requestAnimationFrame(draw);
</script>
</body>
</html>
